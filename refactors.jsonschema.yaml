# yaml-language-server: $schema=https://json-schema.org/draft/2020-12/schema
$schema: https://json-schema.org/draft/2020-12/schema
title: Refactor Proposal
type: object
properties:
  status:
    type: string
    enum: [proposed, accepted, done, rejected]
  blocks:
    description: Candidate packages that shouldn't be built until this resolves.
    type: array
    items:
      type: string
required: [status]
additionalProperties: false
